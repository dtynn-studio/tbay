[package]
name = "tbay"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "tbay-notify",
]

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }


[dependencies]
reqwest = { version = "0.13", features = ["json", "socks"], optional = true }
reqwest-websocket = { version = "0.6", optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"], optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
ctrlc = { version = "3.5.2", optional = true }
humantime = { version = "2.3.0", optional = true }
humantime-serde = { version = "1.1.1", optional = true }
rust_decimal = { version = "1.40.0", features = ["macros", "maths"], optional = true }
scanf = { version = "2.0.0", optional = true }
snafu = { version = "0.9.0", optional = true }
time = { version = "0.3.47", features = ["local-offset", "formatting"], optional = true }
toml = { version = "1.0.6", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
crossterm = { version = "0.29.0", features = ["serde"], optional = true }
dingtalk-sdk = { version = "1.0.9", optional = true }
reqx = { version = "=0.1.27", optional = true }
clap = { workspace = true, optional = true }

dioxus = { version = "=0.7.3", features = ["fullstack", "logger", "web"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["server"]
server = [
    "dioxus/server",
    "dioxus/cli-config",
    "reqwest",
    "reqwest-websocket",
    "futures-util",
    "tokio",
    "crossbeam-channel",
    "ctrlc",
    "humantime",
    "humantime-serde",
    "rust_decimal",
    "scanf",
    "snafu",
    "time",
    "toml",
    "tracing",
    "tracing-subscriber",
    "crossterm",
    "dingtalk-sdk",
    "reqx",
    "clap",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
