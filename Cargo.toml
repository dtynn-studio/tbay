[package]
name = "tbay"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "tbay-notify",
]

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }


[dependencies]
reqwest = { version = "0.13", features = ["json", "socks"] }
reqwest-websocket = "0.6"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
crossbeam-channel = "0.5.15"
ctrlc = "3.5.2"
humantime = "2.3.0"
humantime-serde = "1.1.1"
rust_decimal = { version = "1.40.0", features = ["macros", "maths"] }
scanf = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
snafu = "0.9.0"
time = { version = "0.3.47", features = ["local-offset", "formatting"] }
toml = "1.0.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
crossterm = { version = "0.29.0", features = ["serde"] }
dingtalk-sdk = "1.0.9"
reqx = "=0.1.27"

clap = { workspace = true }
