[package]
name = "tbay"
version = "0.1.0"
edition = "2024"

[dependencies]
binance = "0.21.2"
crossbeam-channel = "0.5.15"
rust_decimal = { version = "1.40.0", features = ["macros", "maths"] }
scanf = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
snafu = "0.9.0"
time = { version = "0.3.47", features = ["local-offset", "formatting"] }
toml = "1.0.6"
